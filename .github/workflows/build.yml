name: 构建所有客户端

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  build-all:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: 缓存 Tauri CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-2

      - name: 安装 Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2"
          else
            echo "Tauri CLI 已缓存"
          fi

      - name: 生成所有客户端源码
        run: python3 build.py

      - name: 构建所有客户端
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, subprocess, os, glob
          apps = json.load(open('apps.json', encoding='utf-8'))
          for app in apps:
              name = app['name']
              print(f"=== 构建 {name} ===")
              os.chdir(f"apps/{name}")
              subprocess.run("npx @tauri-apps/cli icon src-tauri/icons/icon.png", shell=True, check=False)
              r = subprocess.run("cargo tauri build", shell=True)
              if r.returncode != 0:
                  print(f"❌ {name} 构建失败")
                  exit(1)
              os.chdir("../..")
          print("✅ 全部构建完成")
          EOF

      - name: 打包 zip
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, shutil, glob
          apps = json.load(open('apps.json', encoding='utf-8'))
          os.makedirs('release', exist_ok=True)
          for app in apps:
              name = app['name']
              title = app['title']
              pkg_dir = f"release/{title}"
              os.makedirs(pkg_dir, exist_ok=True)
              # exe
              for exe in glob.glob(f"apps/{name}/src-tauri/target/release/*.exe"):
                  shutil.copy(exe, pkg_dir)
              # settings.ini
              shutil.copy(f"apps/{name}/settings.ini", pkg_dir)
              # MSI
              os.makedirs('release/msi', exist_ok=True)
              for msi in glob.glob(f"apps/{name}/src-tauri/target/release/bundle/msi/*.msi"):
                  shutil.copy(msi, 'release/msi')
              # zip
              shutil.make_archive(f"release/{title}-Windows-x64", 'zip', pkg_dir)
              print(f"打包 {title} 完成")
          print("✅ 打包完成")
          EOF

      - name: 发布到 Release（覆盖旧版本）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, glob, urllib.request, urllib.parse

          GH_TOKEN = os.environ['GH_TOKEN']
          REPO = "yuehex15/lightweight-clients"
          API = f"https://api.github.com/repos/{REPO}"
          UPLOAD = f"https://uploads.github.com/repos/{REPO}"

          def req(url, method="GET", data=None, headers=None, raw=False):
              h = {"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github.v3+json"}
              if headers: h.update(headers)
              body = None
              if data is not None:
                  if raw:
                      body = data
                  else:
                      body = json.dumps(data).encode('utf-8')
                      h["Content-Type"] = "application/json"
              r = urllib.request.Request(url, data=body, method=method, headers=h)
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          apps = json.load(open('apps.json', encoding='utf-8'))
          for app in apps:
              name = app['name']
              title = app['title']
              zip_path = glob.glob(f"release/{title}-Windows-x64.zip")[0]
              msi_paths = glob.glob(f"release/msi/{title}*.msi")

              # 创建 release（若 tag 已存在会 422，则获取现有）
              status, body = req(f"{API}/releases", "POST", {
                  "tag_name": name, "name": title,
                  "body": f"{title} 轻量 Windows 客户端 — 由 GitHub Actions 自动构建",
                  "draft": False, "prerelease": False
              })
              release_id = None
              if status == 201:
                  release_id = json.loads(body)['id']
              else:
                  status, body = req(f"{API}/releases/tags/{name}")
                  if status == 200:
                      release_id = json.loads(body)['id']

              if not release_id:
                  print(f"❌ {name}: 无法创建/获取 release (HTTP {status})")
                  continue

              # 上传 zip
              with open(zip_path, 'rb') as f:
                  data = f.read()
              fname = urllib.parse.quote(zip_path.split('/')[-1])
              status, body = req(f"{UPLOAD}/releases/{release_id}/assets?name={fname}",
                                 "POST", data, {"Content-Type": "application/zip"}, raw=True)
              print(f"  {title}: zip {'✅' if status in (200,201) else '❌ HTTP '+str(status)}")

              # 上传 MSI
              for msi in msi_paths:
                  with open(msi, 'rb') as f:
                      data = f.read()
                  fname = urllib.parse.quote(msi.split('/')[-1])
                  status, body = req(f"{UPLOAD}/releases/{release_id}/assets?name={fname}",
                                     "POST", data, {"Content-Type": "application/octet-stream"}, raw=True)
                  print(f"  {title}: MSI {'✅' if status in (200,201) else '❌ HTTP '+str(status)}")
          print("✅ 发布完成")
          EOF