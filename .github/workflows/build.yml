name: 构建所有客户端

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  build-all:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: 缓存 Tauri CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-2

      - name: 安装 Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2"
          else
            echo "Tauri CLI 已缓存"
          fi

      - name: 生成所有客户端源码
        run: python3 build.py

      - name: 下载 WebView2 运行时（便携）
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, shutil, subprocess
          apps = json.load(open('apps.json', encoding='utf-8'))
          try:
              # 用 winget 安装 WebView2 运行时
              print("安装 WebView2 运行时...")
              subprocess.run(["winget", "install", "Microsoft.EdgeWebView2Runtime",
                  "--accept-source-agreements", "--accept-package-agreements", "--silent"],
                  check=True, timeout=300)
              # 找到安装目录（过滤掉非版本号目录）
              for d in ["C:\\Program Files (x86)\\Microsoft\\EdgeWebView\\Application",
                         "C:\\Program Files\\Microsoft\\EdgeWebView\\Application"]:
                  if os.path.exists(d):
                      import re
                      vers = [v for v in os.listdir(d) if os.path.isdir(os.path.join(d, v)) and re.match(r'^\d+\.\d+\.\d+\.\d+$', v)]
                      if vers:
                          vers.sort(reverse=True)
                          rt_dir = os.path.join(d, vers[0])
                          break
              else:
                  print("找不到 WebView2 安装目录"); exit(1)
              print(f"  运行时: {rt_dir}")
              # 复制运行时，精简不必要的文件
              for app in apps:
                  name = app['name']; dst = f"apps/{name}/webview2-runtime"
                  shutil.rmtree(dst, ignore_errors=True)
                  # 复制整个版本目录
                  shutil.copytree(rt_dir, dst)
                  # 删除不必要的目录和文件
                  for item in os.listdir(dst):
                      item_path = os.path.join(dst, item)
                      # 删除 DRM 模块
                      if item == "WidevineCdm" and os.path.isdir(item_path):
                          shutil.rmtree(item_path)
                      # 删除 pdb 调试符号
                      elif item.endswith(".pdb"):
                          os.remove(item_path)
                      # 精简 locales（只保留中文和英文）
                      elif item == "locales" and os.path.isdir(item_path):
                          for loc in os.listdir(item_path):
                              if loc not in ("en-US.pak", "zh-CN.pak", "zh-TW.pak"):
                                  os.remove(os.path.join(item_path, loc))
                  # 删除顶层不需要的文件
                  for skip in ("swiftshader", "vk_swiftshader.dll", "xinput1_3.dll",
                               "d3dcompiler_47.dll", "subresource_filter_ruleset.pak"):
                      skip_path = os.path.join(dst, skip)
                      if os.path.isdir(skip_path):
                          shutil.rmtree(skip_path)
                      elif os.path.exists(skip_path):
                          os.remove(skip_path)
                  total = sum(os.path.getsize(os.path.join(dp,f)) for dp,_,fs in os.walk(dst) for f in fs)
                  print(f"  {name}: 已就绪 ({total/1024/1024:.1f} MB)")
          except Exception as e:
              print(f"失败: {e}"); exit(1)
          EOF

      - name: 构建所有客户端
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, subprocess, os
          apps = json.load(open('apps.json', encoding='utf-8'))
          for app in apps:
              name = app['name']
              print(f"=== 构建 {name} ===")
              os.chdir(f"apps/{name}")
              subprocess.run("npx @tauri-apps/cli icon src-tauri/icons/icon.png", shell=True, check=False)
              r = subprocess.run("cargo tauri build", shell=True)
              if r.returncode != 0:
                  print(f"❌ {name} 构建失败"); exit(1)
              os.chdir("../..")
          print("✅ 全部构建完成")
          EOF

      - name: 打包 zip
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, shutil, glob
          apps = json.load(open('apps.json', encoding='utf-8'))
          os.makedirs('release', exist_ok=True)
          for app in apps:
              name = app['name']; title = app['title']
              pkg_dir = f"release/{title}"
              os.makedirs(pkg_dir, exist_ok=True)
              for exe in glob.glob(f"apps/{name}/src-tauri/target/release/*.exe"):
                  shutil.copy(exe, pkg_dir)
              shutil.copy(f"apps/{name}/settings.ini", pkg_dir)
              rt = f"apps/{name}/webview2-runtime"
              if os.path.exists(rt):
                  shutil.copytree(rt, f"{pkg_dir}/webview2-runtime", dirs_exist_ok=True)
              os.makedirs('release/msi', exist_ok=True)
              for msi in glob.glob(f"apps/{name}/src-tauri/target/release/bundle/msi/*.msi"):
                  shutil.copy(msi, 'release/msi')
              shutil.make_archive(f"release/{title}-Windows-x64", 'zip', pkg_dir)
              print(f"打包 {title} 完成")
          print("✅ 打包完成")
          EOF

      - name: 发布到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, glob, subprocess, urllib.parse
          API = "https://api.github.com/repos/yuehex15/lightweight-clients"
          UPLOAD = "https://uploads.github.com/repos/yuehex15/lightweight-clients"
          # 创建或获取 release (统一 tag: latest)
          r = subprocess.run(["curl", "-s", "-X", "POST", "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
              "-H", "Content-Type: application/json", f"{API}/releases",
              "-d", json.dumps({"tag_name": "latest", "name": "lightweight-clients", "draft": False, "prerelease": False})],
              capture_output=True)
          try:
              release_id = json.loads(r.stdout)['id']
          except:
              r = subprocess.run(["curl", "-s", "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                  f"{API}/releases/tags/latest"], capture_output=True)
              try:
                  release_id = json.loads(r.stdout)['id']
              except:
                  print("❌ 无法获取 release"); exit(1)
          # 上传所有 zip 文件（先删同名旧资产）
          for f in glob.glob("release/*.zip"):
              fname = os.path.basename(f)
              # 先删除同名旧资产
              import json as j
              asset_list = subprocess.run(["curl", "-s", "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                  f"{API}/releases/{release_id}/assets"], capture_output=True)
              for asset in j.loads(asset_list.stdout):
                  if asset['name'] == fname:
                      subprocess.run(["curl", "-s", "-X", "DELETE", "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                          f"{API}/releases/assets/{asset['id']}"])
              subprocess.run(["curl", "-s", "-X", "POST", "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                  "-H", "Content-Type: application/octet-stream", "--data-binary", f"@{f}",
                  f"{UPLOAD}/releases/{release_id}/assets?name={urllib.parse.quote(fname)}"])
              print(f"  {fname}: ✅")
          print("✅ 发布完成")
          EOF