name: 构建所有客户端

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  build-all:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: 缓存 Tauri CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-2

      - name: 安装 Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2"
          else
            echo "Tauri CLI 已缓存"
          fi

      - name: 生成所有客户端源码
        run: python3 build.py

      - name: 下载 WebView2 运行时（便携）
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, shutil, subprocess, urllib.request
          url = "https://go.microsoft.com/fwlink/?linkid=2124701"
          apps = json.load(open('apps.json', encoding='utf-8'))
          tmp = os.path.join(os.environ.get('TEMP', 'C:\\Windows\\Temp'), "wv2")
          try:
              print("下载 WebView2 离线安装器...")
              exe = os.path.join(tmp, "installer.exe")
              os.makedirs(tmp, exist_ok=True)
              urllib.request.urlretrieve(url, exe)
              print(f"  下载完成: {os.path.getsize(exe)/1024/1024:.1f} MB")
              # 第一层解压：安装器 → MSI + CAB
              ext1 = os.path.join(tmp, "extracted")
              r = subprocess.run(["7z", "x", exe, f"-o{ext1}", "-y", "-r"],
                  capture_output=True, text=True, timeout=120)
              print(f"  7z 退出码: {r.returncode}")
              print(f"  7z 输出: {r.stdout[:500]}")
              if r.returncode != 0:
                  print(f"  7z 错误: {r.stderr[:200]}")
              # 列出提取的文件
              files = []
              for root, dirs, fnames in os.walk(ext1):
                  for f in fnames:
                      files.append(os.path.join(root, f))
              print(f"  提取文件数: {len(files)}")
              if files:
                  for f in files[:10]:
                      print(f"    - {os.path.relpath(f, ext1)} ({os.path.getsize(f)/1024/1024:.1f} MB)")
              # 查找 MSI 或实际操作目录
              msi_files = [f for f in files if f.endswith('.msi')]
              if not msi_files:
                  # 可能没有 MSI，直接使用提取的文件
                  print("  无 MSI 文件，直接使用提取的文件")
                  for app in apps:
                      name = app['name']
                      dst = f"apps/{name}/webview2-runtime"
                      shutil.rmtree(dst, ignore_errors=True)
                      shutil.copytree(ext1, dst)
                      print(f"  {name}: 已就绪")
                  exit(0)
              # 第二层解压：MSI → 运行时文件
              for app in apps:
                  name = app['name']
                  dst = f"apps/{name}/webview2-runtime"
                  os.makedirs(dst, exist_ok=True)
                  subprocess.run(["7z", "x", msi_files[0], f"-o{dst}", "-y", "-r"],
                      check=True, capture_output=True, timeout=120)
                  print(f"  {name}: 已就绪")
          except Exception as e:
              print(f"失败: {e}"); exit(1)
          EOF

      - name: 构建所有客户端
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, subprocess, os
          apps = json.load(open('apps.json', encoding='utf-8'))
          for app in apps:
              name = app['name']
              print(f"=== 构建 {name} ===")
              os.chdir(f"apps/{name}")
              subprocess.run("npx @tauri-apps/cli icon src-tauri/icons/icon.png", shell=True, check=False)
              r = subprocess.run("cargo tauri build", shell=True)
              if r.returncode != 0:
                  print(f"❌ {name} 构建失败"); exit(1)
              os.chdir("../..")
          print("✅ 全部构建完成")
          EOF

      - name: 打包 zip
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, shutil, glob
          apps = json.load(open('apps.json', encoding='utf-8'))
          os.makedirs('release', exist_ok=True)
          for app in apps:
              name = app['name']; title = app['title']
              pkg_dir = f"release/{title}"
              os.makedirs(pkg_dir, exist_ok=True)
              for exe in glob.glob(f"apps/{name}/src-tauri/target/release/*.exe"):
                  shutil.copy(exe, pkg_dir)
              shutil.copy(f"apps/{name}/settings.ini", pkg_dir)
              rt = f"apps/{name}/webview2-runtime"
              if os.path.exists(rt):
                  shutil.copytree(rt, f"{pkg_dir}/webview2-runtime", dirs_exist_ok=True)
              os.makedirs('release/msi', exist_ok=True)
              for msi in glob.glob(f"apps/{name}/src-tauri/target/release/bundle/msi/*.msi"):
                  shutil.copy(msi, 'release/msi')
              shutil.make_archive(f"release/{title}-Windows-x64", 'zip', pkg_dir)
              print(f"打包 {title} 完成")
          print("✅ 打包完成")
          EOF

      - name: 发布到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, glob, subprocess, urllib.parse
          API = "https://api.github.com/repos/yuehex15/lightweight-clients"
          UPLOAD = "https://uploads.github.com/repos/yuehex15/lightweight-clients"
          # 创建或获取 release (统一 tag: latest)
          r = subprocess.run(["curl", "-s", "-X", "POST", "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
              "-H", "Content-Type: application/json", f"{API}/releases",
              "-d", json.dumps({"tag_name": "latest", "name": "lightweight-clients", "draft": False, "prerelease": False})],
              capture_output=True)
          try:
              release_id = json.loads(r.stdout)['id']
          except:
              r = subprocess.run(["curl", "-s", "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                  f"{API}/releases/tags/latest"], capture_output=True)
              try:
                  release_id = json.loads(r.stdout)['id']
              except:
                  print("❌ 无法获取 release"); exit(1)
          # 上传所有文件
          for f in glob.glob("release/*.zip") + glob.glob("release/msi/*.msi"):
              fname = os.path.basename(f)
              subprocess.run(["curl", "-s", "-X", "POST", "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                  "-H", "Content-Type: application/octet-stream", "--data-binary", f"@{f}",
                  f"{UPLOAD}/releases/{release_id}/assets?name={urllib.parse.quote(fname)}"])
              print(f"  {fname}: ✅")
          print("✅ 发布完成")
          EOF