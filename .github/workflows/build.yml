name: 构建所有客户端

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  build-all:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: 缓存 Tauri CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-2

      - name: 安装 Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2"
          else
            echo "Tauri CLI 已缓存"
          fi

      - name: 生成所有客户端源码
        run: python3 build.py

      - name: 下载 WebView2 运行时并极致精简
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os, shutil, subprocess, re

          apps = json.load(open('apps.json', encoding='utf-8'))

          # 白名单：只保留这些顶层文件，其余全部删除
          KEEP_TOP_FILES = {
              # 核心引擎
              'msedge.dll', 'msedgewebview2.exe', 'msedge_elf.dll',
              'msedge_proxy.exe', 'msedge_wer.dll', 'webview2_integration.dll',
              # 核心资源
              'resources.pak', 'msedge_100_percent.pak', 'msedge_200_percent.pak',
              'icudtl.dat', 'v8_context_snapshot.bin',
              # 图形/视频（B站需要）
              'dxcompiler.dll', 'dxil.dll', 'vulkan-1.dll', 'ffmpeg.dll',
              # VC++ 运行库
              'msvcp140.dll', 'msvcp140_codecvt_ids.dll', 'vcruntime140.dll',
              'vcruntime140_1.dll', 'vccorlib140.dll', 'concrt140.dll',
              # 输入法
              'textInputMethod.sccd',
          }

          # 保留的目录（整个目录不动）
          KEEP_DIRS = {'EBWebView'}

          # 保留的 Locales
          KEEP_LOCALES = {'en-US.pak', 'zh-CN.pak', 'zh-TW.pak'}

          try:
              # 用 winget 安装 WebView2 运行时
              print("安装 WebView2 运行时...")
              subprocess.run(["winget", "install", "Microsoft.EdgeWebView2Runtime",
                  "--accept-source-agreements", "--accept-package-agreements", "--silent"],
                  check=True, timeout=300)
              # 找到安装目录
              for d in ["C:\\Program Files (x86)\\Microsoft\\EdgeWebView\\Application",
                         "C:\\Program Files\\Microsoft\\EdgeWebView\\Application"]:
                  if os.path.exists(d):
                      vers = [v for v in os.listdir(d) if os.path.isdir(os.path.join(d, v)) and re.match(r'^\d+\.\d+\.\d+\.\d+$', v)]
                      if vers:
                          vers.sort(reverse=True)
                          rt_dir = os.path.join(d, vers[0])
                          break
              else:
                  print("找不到 WebView2 安装目录"); exit(1)

              print(f"  运行时目录: {rt_dir}")

              for app in apps:
                  name = app['name']
                  dst = f"apps/{name}/webview2-runtime"
                  shutil.rmtree(dst, ignore_errors=True)
                  os.makedirs(dst, exist_ok=True)

                  # 遍历运行时目录，按白名单复制
                  for item in os.listdir(rt_dir):
                      src = os.path.join(rt_dir, item)
                      dst_item = os.path.join(dst, item)

                      # 目录处理
                      if os.path.isdir(src):
                          if item in KEEP_DIRS:
                              # 保留整个目录
                              shutil.copytree(src, dst_item)
                              total = sum(os.path.getsize(os.path.join(dp,f)) for dp,_,fs in os.walk(dst_item) for f in fs)
                              print(f"  ✓ 保留目录 {item} ({total/1024/1024:.1f} MB)")
                          elif item == 'Locales':
                              # 只保留中英文
                              os.makedirs(dst_item, exist_ok=True)
                              for loc in os.listdir(src):
                                  if loc in KEEP_LOCALES:
                                      shutil.copy2(os.path.join(src, loc), os.path.join(dst_item, loc))
                              total = sum(os.path.getsize(os.path.join(dp,f)) for dp,_,fs in os.walk(dst_item) for f in fs)
                              print(f"  ✓ 保留 Locales (精简后 {total/1024/1024:.1f} MB)")
                          else:
                              sz = sum(os.path.getsize(os.path.join(dp,f)) for dp,_,fs in os.walk(src) for f in fs)
                              print(f"  ✗ 删除目录 {item} ({sz/1024/1024:.1f} MB)")

                      # 文件处理
                      elif os.path.isfile(src):
                          if item in KEEP_TOP_FILES:
                              shutil.copy2(src, dst_item)
                              print(f"  ✓ 保留 {item} ({os.path.getsize(src)/1024/1024:.1f} MB)")
                          else:
                              sz = os.path.getsize(src)
                              if sz > 1024*1024:
                                  print(f"  ✗ 删除 {item} ({sz/1024/1024:.1f} MB)")
                              # 小文件不打印

                  # 统计最终大小
                  total = sum(os.path.getsize(os.path.join(dp,f)) for dp,_,fs in os.walk(dst) for f in fs)
                  print(f"  → {name}: 运行时精简后 {total/1024/1024:.1f} MB")

          except Exception as e:
              print(f"失败: {e}"); exit(1)
          PYEOF

      - name: 构建所有客户端
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, subprocess, os
          apps = json.load(open('apps.json', encoding='utf-8'))
          for app in apps:
              name = app['name']
              print(f"=== 构建 {name} ===")
              os.chdir(f"apps/{name}")
              subprocess.run("npx @tauri-apps/cli icon src-tauri/icons/icon.png", shell=True, check=False)
              r = subprocess.run("cargo tauri build", shell=True)
              if r.returncode != 0:
                  print(f"❌ {name} 构建失败"); exit(1)
              os.chdir("../..")
          print("✅ 全部构建完成")
          EOF

      - name: 打包 zip
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, shutil, glob
          apps = json.load(open('apps.json', encoding='utf-8'))
          os.makedirs('release', exist_ok=True)
          for app in apps:
              name = app['name']; title = app['title']
              pkg_dir = f"release/{title}"
              os.makedirs(pkg_dir, exist_ok=True)
              for exe in glob.glob(f"apps/{name}/src-tauri/target/release/*.exe"):
                  shutil.copy(exe, pkg_dir)
              shutil.copy(f"apps/{name}/settings.ini", pkg_dir)
              rt = f"apps/{name}/webview2-runtime"
              if os.path.exists(rt):
                  shutil.copytree(rt, f"{pkg_dir}/webview2-runtime", dirs_exist_ok=True)
              os.makedirs('release/msi', exist_ok=True)
              for msi in glob.glob(f"apps/{name}/src-tauri/target/release/bundle/msi/*.msi"):
                  shutil.copy(msi, 'release/msi')
              shutil.make_archive(f"release/{title}-Windows-x64", 'zip', pkg_dir)
              print(f"打包 {title} 完成")
          print("✅ 打包完成")
          EOF

      - name: 发布到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, glob, subprocess, urllib.parse
          API = "https://api.github.com/repos/yuehex15/lightweight-clients"
          UPLOAD = "https://uploads.github.com/repos/yuehex15/lightweight-clients"
          GH_TOKEN = os.environ['GH_TOKEN']
          headers = ["-H", f"Authorization: token {GH_TOKEN}"]
          # 创建或获取 release (统一 tag: latest)
          r = subprocess.run(["curl", "-s", "-X", "POST", *headers,
              "-H", "Content-Type: application/json", f"{API}/releases",
              "-d", json.dumps({"tag_name": "latest", "name": "lightweight-clients", "draft": False, "prerelease": False})],
              capture_output=True)
          try:
              release_id = json.loads(r.stdout)['id']
          except:
              r = subprocess.run(["curl", "-s", *headers, f"{API}/releases/tags/latest"], capture_output=True)
              try:
                  release_id = json.loads(r.stdout)['id']
              except:
                  print("❌ 无法获取 release"); exit(1)
          # 上传所有 zip 文件（先删同名旧资产）
          for f in glob.glob("release/*.zip"):
              fname = os.path.basename(f)
              # 先删除同名旧资产
              asset_list = subprocess.run(["curl", "-s", *headers, f"{API}/releases/{release_id}/assets"], capture_output=True)
              for asset in json.loads(asset_list.stdout):
                  if asset['name'] == fname:
                      subprocess.run(["curl", "-s", "-X", "DELETE", *headers, f"{API}/releases/assets/{asset['id']}"])
              subprocess.run(["curl", "-s", "-X", "POST", *headers,
                  "-H", "Content-Type: application/octet-stream", "--data-binary", f"@{f}",
                  f"{UPLOAD}/releases/{release_id}/assets?name={urllib.parse.quote(fname)}"])
              print(f"  {fname}: ✅")
          print("✅ 发布完成")
          EOF