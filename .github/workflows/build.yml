name: 构建所有客户端

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  build-all:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: 缓存 Tauri CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-2

      - name: 安装 Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2"
          else
            echo "Tauri CLI 已缓存"
          fi

      - name: 生成所有客户端源码
        run: python3 build.py

      - name: 构建所有客户端
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, subprocess, os, glob
          apps = json.load(open('apps.json', encoding='utf-8'))
          for app in apps:
              name = app['name']
              print(f"=== 构建 {name} ===")
              os.chdir(f"apps/{name}")
              subprocess.run("npx @tauri-apps/cli icon src-tauri/icons/icon.png", shell=True, check=False)
              r = subprocess.run("cargo tauri build", shell=True)
              if r.returncode != 0:
                  print(f"❌ {name} 构建失败")
                  exit(1)
              os.chdir("../..")
          print("✅ 全部构建完成")
          EOF

      - name: 打包 zip
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, shutil, glob
          apps = json.load(open('apps.json', encoding='utf-8'))
          os.makedirs('release', exist_ok=True)
          for app in apps:
              name = app['name']
              title = app['title']
              pkg_dir = f"release/{title}"
              os.makedirs(pkg_dir, exist_ok=True)
              # exe
              for exe in glob.glob(f"apps/{name}/src-tauri/target/release/*.exe"):
                  shutil.copy(exe, pkg_dir)
              # settings.ini
              shutil.copy(f"apps/{name}/settings.ini", pkg_dir)
              # MSI
              os.makedirs('release/msi', exist_ok=True)
              for msi in glob.glob(f"apps/{name}/src-tauri/target/release/bundle/msi/*.msi"):
                  shutil.copy(msi, 'release/msi')
              # zip
              shutil.make_archive(f"release/{title}-Windows-x64", 'zip', pkg_dir)
              print(f"打包 {title} 完成")
          print("✅ 打包完成")
          EOF

      - name: 发布到 Release（覆盖旧版本）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, glob, subprocess, urllib.parse
          apps = json.load(open('apps.json', encoding='utf-8'))
          for app in apps:
              name = app['name']
              title = app['title']
              zip_path = glob.glob(f"release/{title}-Windows-x64.zip")[0]
              msi_paths = glob.glob(f"release/msi/{title}*.msi")

              # 创建或更新 release
              create = subprocess.run(
                  ["curl", "-s", "-X", "POST",
                   "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                   "-H", "Accept: application/vnd.github.v3+json",
                   "https://api.github.com/repos/yuehex15/lightweight-clients/releases",
                   "-d", json.dumps({
                       "tag_name": name,
                       "name": title,
                       "body": f"{title} 轻量 Windows 客户端 — 由 GitHub Actions 自动构建",
                       "draft": False,
                       "prerelease": False
                   })],
                  capture_output=True, text=True)
              import json as j
              try:
                  rel = j.loads(create.stdout)
                  release_id = rel.get('id')
              except:
                  release_id = None

              # 如果已存在（tag 冲突），获取现有 release id
              if not release_id:
                  get = subprocess.run(
                      ["curl", "-s", "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                       f"https://api.github.com/repos/yuehex15/lightweight-clients/releases/tags/{name}"],
                      capture_output=True, text=True)
                  try:
                      rel = j.loads(get.stdout)
                      release_id = rel.get('id')
                  except:
                      release_id = None

              if not release_id:
                  print(f"❌ {name}: 无法创建或获取 release")
                  continue

              # 上传 zip
              up = subprocess.run(
                  ["curl", "-s", "-X", "POST",
                   "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                   "-H", "Content-Type: application/zip",
                   f"https://uploads.github.com/repos/yuehex15/lightweight-clients/releases/{release_id}/assets?name={urllib.parse.quote(zip_path.split('/')[-1])}",
                   "--data-binary", f"@{zip_path}"],
                  capture_output=True, text=True)
              print(f"  {title}: 上传 zip {'✅' if 'browser_download_url' in up.stdout else '❌'}")

              # 上传 MSI
              for msi in msi_paths:
                  up = subprocess.run(
                      ["curl", "-s", "-X", "POST",
                       "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                       "-H", "Content-Type: application/octet-stream",
                       f"https://uploads.github.com/repos/yuehex15/lightweight-clients/releases/{release_id}/assets?name={urllib.parse.quote(msi.split('/')[-1])}",
                       "--data-binary", f"@{msi}"],
                      capture_output=True, text=True)
                  print(f"  {title}: 上传 MSI {'✅' if 'browser_download_url' in up.stdout else '❌'}")
          print("✅ 发布完成")
          EOF